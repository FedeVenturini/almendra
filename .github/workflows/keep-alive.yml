name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */2 * *'  # cada 2 días al mediodía
  workflow_dispatch:          # también se puede correr a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/product_catalog?select=id&limit=1" \
            -o /dev/null -w "Status: %{http_code}\n"
