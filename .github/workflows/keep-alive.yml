name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */2 * *'  # cada 2 días al mediodía
  workflow_dispatch:          # también se puede correr a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # Insertar
          curl -s -X POST \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive" \
            -w "INSERT status: %{http_code}\n"
          # Borrar todos los registros viejos
          curl -s -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?id=gte.1" \
            -w "DELETE status: %{http_code}\n"
